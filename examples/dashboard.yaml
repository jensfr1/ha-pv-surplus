# PV-Ueberschussladen - Dashboard
#
# Einfuegen: Dashboard oeffnen -> Stift -> Drei-Punkte-Menue ->
#            "Raw-Konfigurationseditor" -> alles ersetzen -> Speichern.
#
# ACHTUNG bei den Entitaets-IDs: Sie entstehen aus dem Geraetenamen der
# Einrichtung UND aus der SYSTEMSPRACHE von Home Assistant. Auf einem
# englischen System heisst es _surplus und _target_current, auf einem
# deutschen _uberschuss und _sollstrom. Deine echten IDs findest du in
# Entwicklerwerkzeuge -> Vorlage:
#
#   {% for e in states if 'ueberschussladen' in e.entity_id %}
#   {{ e.entity_id }}
#   {%- endfor %}
#
# Die Ansicht "Laden" braucht nur Standard-Karten. "Regeln" nutzt
# mushroom, mini-graph-card und slider-entity-row aus HACS.

views:

  # ── Alltag ───────────────────────────────────────────────────────────
  - title: Laden
    path: laden
    icon: mdi:ev-station
    cards:

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: sensor.pv_ueberschussladen_surplus
            icon: mdi:solar-power
            icon_color: green
          - type: entity
            entity: sensor.pv_ueberschussladen_target_current
            icon: mdi:current-ac
            icon_color: blue
          - type: entity
            entity: sensor.daheimlader_ladeleistung
            icon: mdi:ev-station
            icon_color: purple
          - type: entity
            entity: sensor.pv_ueberschussladen_phases
            icon: mdi:sine-wave
            icon_color: grey

      # Der Modus ist die wichtigste Bedienung - deshalb ganz oben, gross.
      - type: custom:mushroom-select-card
        entity: select.pv_ueberschussladen_mode
        name: Betriebsart
        icon: mdi:tune-variant
        fill_container: false

      # Sagt in jeder Lage, warum gerade das passiert, was passiert.
      - type: markdown
        content: |
          {% set s = states('sensor.pv_ueberschussladen_status') %}
          {% if s == 'grid_limited' %}
          ### ⚠️ Netzbezugs-Sperre aktiv
          Es fließt Strom aus dem Netz, während geladen wird. Die Sperre hat
          gedeckelt und gibt alle zwei Minuten ein Ampere wieder frei.
          {% elif s == 'probing' %}
          ### 🔎 Tast-Betrieb läuft
          Die Anlage ist abgeregelt — die Einspeisung liegt bei null, obwohl
          das Dach mehr könnte. Der Ladestrom wird schrittweise erhöht,
          solange die Anlage mitzieht.
          {% elif s == 'stale' %}
          ### ❌ Keine Messwerte
          Der Netzzähler schweigt seit über zwei Minuten. Ohne ihn ist
          Überschussladen Raten, deshalb ist die Ladung ausgesetzt.
          {% elif s == 'paused' %}
          ### ⏸ Pausiert
          Der Überschuss reicht nicht für den Mindeststrom. Nach drei Minuten
          unter der Schwelle wird abgeschaltet.
          {% elif s == 'off' %}
          ### Regelung aus
          Betriebsart oben auf „Nur Solarstrom" stellen, um zu starten.
          {% elif s == 'charging' %}
          ### ⚡ Lädt mit Überschuss
          {% else %}
          ### Wartet auf Überschuss
          {% endif %}

          {{ state_attr('sensor.pv_ueberschussladen_status', 'reason') or '' }}

      - type: custom:mini-graph-card
        name: Überschuss und Ladung
        icon: mdi:chart-line
        hours_to_show: 12
        points_per_hour: 12
        line_width: 3
        animate: true
        show:
          fill: fade
          legend: true
          extrema: true
        entities:
          - entity: sensor.ocean2_solar_power
            name: Solar
            color: "#ffb300"
          - entity: sensor.daheimlader_ladeleistung
            name: Auto
            color: "#7e57c2"
          - entity: sensor.ocean2_grid_power
            name: Netz
            color: "#e53935"

      - type: entities
        title: Ladung
        entities:
          - entity: switch.daheimlader_charging_enable
            name: Ladefreigabe
          - type: custom:slider-entity-row
            entity: input_number.daheimlader_strombegrenzung
            name: Strombegrenzung
            full_row: false
          - type: divider
          - type: custom:multiple-entity-row
            entity: sensor.daheimlader_ladeleistung
            name: Ströme je Phase
            show_state: false
            entities:
              - entity: sensor.daheimlader_ladestrom_l1
                name: L1
              - entity: sensor.daheimlader_ladestrom_l2
                name: L2
              - entity: sensor.daheimlader_ladestrom_l3
                name: L3

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: sensor.pv_ueberschussladen_charged_total
            name: Gesamt
          - type: tile
            entity: sensor.pv_ueberschussladen_of_which_solar
            name: Sonne
            color: amber
          - type: tile
            entity: sensor.pv_ueberschussladen_of_which_grid
            name: Netz
            color: red

  # ── Regeln und Grenzen ───────────────────────────────────────────────
  - title: Regeln
    path: regeln
    icon: mdi:tune
    cards:

      - type: entities
        title: Ladestrom
        entities:
          - type: custom:slider-entity-row
            entity: number.pv_ueberschussladen_minimum_charging_current
            name: Mindeststrom
          - type: custom:slider-entity-row
            entity: number.pv_ueberschussladen_maximum_charging_current
            name: Höchster Strom
          - type: custom:slider-entity-row
            entity: number.pv_ueberschussladen_manual_charging_current
            name: Manueller Strom

      - type: entities
        title: Reserven
        entities:
          - type: custom:slider-entity-row
            entity: number.pv_ueberschussladen_reserve_for_the_house
            name: Reserve fürs Haus
          - type: custom:slider-entity-row
            entity: number.pv_ueberschussladen_home_battery_reserve
            name: Reserve Hausbatterie
          - type: custom:slider-entity-row
            entity: number.pv_ueberschussladen_minimum_vehicle_charge
            name: Mindestladestand Auto

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.pv_ueberschussladen_probing
            name: Tast-Betrieb
            icon: mdi:magnify-scan
            icon_color: orange
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: sensor.pv_ueberschussladen_status
            name: Status
            icon: mdi:information-outline
            secondary_info: last-changed

      - type: markdown
        content: |
          ### Was die Modi bedeuten

          | Modus | Kann Netzstrom ziehen? |
          |---|---|
          | Aus | nein, es wird nichts gestellt |
          | Nur Solarstrom | **nein** |
          | Min + Solarstrom | ja, mit Mindeststrom bei fast leerem Auto |
          | Manuell | ja |
          | Maximum | ja |

          Der **Tast-Betrieb** ist nur für abgeregelte Anlagen. Bei
          Nulleinspeisung drosselt der Wechselrichter aufs Bedarfsmaß, die
          gemessene Einspeisung ist dann immer null — und die Regelung würde
          nie starten. Der Tast-Betrieb gibt schrittweise mehr frei und nimmt
          zurück, sobald Netzbezug entsteht oder die Hausbatterie einspringt.

          Speist deine Anlage frei ein, lass ihn aus.

      - type: custom:mini-graph-card
        name: Sollstrom
        hours_to_show: 24
        points_per_hour: 12
        line_width: 2
        show:
          fill: fade
          extrema: true
        entities:
          - entity: sensor.pv_ueberschussladen_target_current
            name: Sollstrom
            color: "#42a5f5"

  # ── Anlage ───────────────────────────────────────────────────────────
  - title: Anlage
    path: anlage
    icon: mdi:home-lightning-bolt
    cards:

      - type: custom:power-flow-card-plus
        title: Energiefluss
        clickable_entities: true
        entities:
          solar:
            entity: sensor.ocean2_solar_power
            name: Solar
          battery:
            entity: sensor.ocean2_battery
            name: Speicher
            state_of_charge: sensor.ocean2_battery
          grid:
            entity: sensor.ocean2_grid_power
            name: Netz
            invert_state: false
          home:
            entity: sensor.ocean2_house_consumption
            name: Haus
          individual:
            - entity: sensor.daheimlader_ladeleistung
              name: Auto
              icon: mdi:car-electric
              color: [126, 87, 194]
        display:
          show_zero_lines: false
          animation_speed: 4

      - type: custom:mini-graph-card
        name: Speicher
        hours_to_show: 48
        points_per_hour: 4
        line_width: 3
        show:
          fill: fade
        entities:
          - entity: sensor.ocean2_battery
            name: Ladestand
            color: "#26a69a"
