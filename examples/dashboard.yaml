# ─────────────────────────────────────────────────────────────────────────────
#  PV-Überschussladen — Dashboard
#
#  Einfügen: Dashboard öffnen → Stift oben rechts → Drei-Punkte-Menü →
#            "Raw-Konfigurationseditor" → alles ersetzen → Speichern.
#
#  Nur Standard-Karten, keine HACS-Frontend-Erweiterungen nötig.
#
#  ⚠ Die Entitäts-IDs entstehen aus zwei Dingen, die bei dir anders sein
#    können als hier:
#
#    1. dem Gerätenamen aus der Einrichtung (hier: "PV-Ueberschussladen"
#       → Präfix pv_ueberschussladen)
#    2. der SYSTEMSPRACHE von Home Assistant. Entitätsnamen werden
#       serverseitig übersetzt, und die IDs entstehen aus dem übersetzten
#       Namen. Bei englischer Systemsprache heißt es _surplus, bei
#       deutscher _uberschuss.
#
#    Deine echten IDs findest du in Entwicklerwerkzeuge → Vorlage mit:
#      {% for e in states if 'ueberschussladen' in e.entity_id %}
#      {{ e.entity_id }}
#      {%- endfor %}
# ─────────────────────────────────────────────────────────────────────────────

views:
  - title: Laden
    path: laden
    icon: mdi:ev-station
    type: sections
    max_columns: 3
    sections:

      # ── Was gerade passiert ─────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Jetzt
            heading_style: title
            icon: mdi:solar-power-variant

          - type: tile
            entity: sensor.pv_ueberschussladen_status
            name: Status
            # Die Regelung legt ihre Begründung als Attribut bei - damit steht
            # hier im Klartext, warum gerade nichts fließt.
            state_content:
              - state
              - reason
            vertical: false

          - type: tile
            entity: select.pv_ueberschussladen_mode
            name: Betriebsart
            icon: mdi:tune-variant
            features:
              - type: select-options

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.pv_ueberschussladen_surplus
                name: Überschuss
                color: green
              - type: tile
                entity: sensor.pv_ueberschussladen_target_current
                name: Sollstrom
                color: blue

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.daheimlader_ladeleistung
                name: Lädt gerade
                color: purple
              - type: tile
                entity: sensor.pv_ueberschussladen_phases
                name: Phasen
                icon: mdi:sine-wave

      # ── Leistungsverlauf ────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Verlauf
            heading_style: title
            icon: mdi:chart-line

          - type: history-graph
            hours_to_show: 12
            entities:
              - entity: sensor.ocean2_solar_power
                name: Solar
              - entity: sensor.ocean2_grid_power
                name: Netz
              - entity: sensor.daheimlader_ladeleistung
                name: Auto

          # Sollstrom als eigene Kurve: Der Verlauf zeigt, wie die Regelung
          # der Sonne folgt - und wo sie es nicht konnte.
          - type: history-graph
            hours_to_show: 12
            entities:
              - entity: sensor.pv_ueberschussladen_target_current
                name: Sollstrom
              - entity: sensor.pv_ueberschussladen_status
                name: Status

      # ── Steuerung ───────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Einstellungen
            heading_style: title
            icon: mdi:cog

          - type: entities
            entities:
              - entity: number.pv_ueberschussladen_minimum_charging_current
                name: Mindeststrom
              - entity: number.pv_ueberschussladen_maximum_charging_current
                name: Höchster Strom
              - entity: number.pv_ueberschussladen_manual_charging_current
                name: Manuell
              - type: divider
              - entity: number.pv_ueberschussladen_reserve_for_the_house
                name: Reserve fürs Haus
              - entity: number.pv_ueberschussladen_home_battery_reserve
                name: Reserve Hausbatterie
              - entity: number.pv_ueberschussladen_minimum_vehicle_charge
                name: Mindestladestand Auto

          - type: entities
            title: Schalter
            entities:
              - entity: switch.pv_ueberschussladen_probing
                name: Tast-Betrieb
                secondary_info: last-changed
              - entity: switch.daheimlader_charging_enable
                name: Ladefreigabe (Wallbox)
              - entity: input_number.daheimlader_strombegrenzung
                name: Strombegrenzung (Wallbox)

      # ── Ertrag ──────────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Geladen
            heading_style: title
            icon: mdi:counter

          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: sensor.pv_ueberschussladen_charged_total
                name: Gesamt
              - type: tile
                entity: sensor.pv_ueberschussladen_of_which_solar
                name: Sonne
                color: amber
              - type: tile
                entity: sensor.pv_ueberschussladen_of_which_grid
                name: Netz
                color: red

          - type: statistic
            entity: sensor.pv_ueberschussladen_of_which_solar
            period:
              calendar:
                period: month
            stat_type: change
            name: Sonnenstrom diesen Monat

      # ── Anlage ──────────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Anlage
            heading_style: title
            icon: mdi:home-lightning-bolt

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.ocean2_solar_power
                name: Solar
                color: amber
              - type: tile
                entity: sensor.ocean2_grid_power
                name: Netz
              - type: tile
                entity: sensor.ocean2_battery_power
                name: Batterie
              - type: tile
                entity: sensor.ocean2_battery
                name: Speicher

          - type: gauge
            entity: sensor.ocean2_battery
            name: Hausbatterie
            min: 0
            max: 100
            needle: true
            severity:
              green: 50
              yellow: 20
              red: 0

      # ── Diagnose ────────────────────────────────────────────────────────
      #  Nur sichtbar, wenn tatsächlich etwas eingreift. Im Normalbetrieb
      #  soll hier nichts stehen - sonst gewöhnt man sich an Meldungen.
      - type: grid
        cards:
          - type: heading
            heading: Eingriffe
            heading_style: title
            icon: mdi:shield-alert

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.pv_ueberschussladen_status
                state: grid_limited
            card:
              type: markdown
              content: >
                ### ⚠️ Netzbezugs-Sperre aktiv

                Es fließt Strom aus dem Netz, während geladen wird. Die Sperre
                hat den Ladestrom gedeckelt und gibt ihn alle zwei Minuten um
                ein Ampere wieder frei.

                {% set d = states('sensor.pv_ueberschussladen_grid_guard_cap') %}
                {% if d not in ['unknown', 'unavailable'] %}Deckel: {{ d }} A
                {%- else %}(Diagnose-Sensor ist deaktiviert){% endif %}

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.pv_ueberschussladen_status
                state: probing
            card:
              type: markdown
              content: >
                ### 🔎 Tast-Betrieb läuft

                Die Anlage ist abgeregelt, die Einspeisung liegt also bei null,
                obwohl das Dach mehr könnte. Die Regelung erhöht den Ladestrom
                schrittweise und beobachtet, ob die Anlage mitzieht.

                {% set c = states('sensor.pv_ueberschussladen_probe_ceiling') %}
                {% if c not in ['unknown', 'unavailable'] %}Gefundene Obergrenze: {{ c }} A
                {%- else %}(Diagnose-Sensor ist deaktiviert){% endif %}

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.pv_ueberschussladen_status
                state: stale
            card:
              type: markdown
              content: >
                ### ❌ Keine Messwerte

                Der Netzzähler liefert seit über zwei Minuten nichts mehr.
                Ohne ihn ist Überschussladen Raten — die Ladung ist deshalb
                ausgesetzt.

          # Die beiden Diagnose-Sensoren sind ab Werk deaktiviert, damit die
          # Geräteseite lesbar bleibt. Zum Verwenden: Gerät öffnen → Entität
          # anklicken → Zahnrad → "Aktiviert" einschalten.
          - type: entities
            title: Werte im Detail
            entities:
              # Erst aktivieren (siehe Kommentar oben), dann einkommentieren:
              # - entity: sensor.pv_ueberschussladen_grid_guard_cap
              #   name: Deckel der Netzsperre
              # - entity: sensor.pv_ueberschussladen_probe_ceiling
              #   name: Getastete Obergrenze
              - entity: sensor.daheimlader_ladestrom_limit
                name: Limit an der Wallbox
              - type: divider
              - entity: sensor.daheimlader_ladestrom_l1
                name: Strom L1
              - entity: sensor.daheimlader_ladestrom_l2
                name: Strom L2
              - entity: sensor.daheimlader_ladestrom_l3
                name: Strom L3
