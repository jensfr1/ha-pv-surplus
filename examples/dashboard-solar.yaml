# Solar - beide Anlagen, jeder String einzeln
#
# Eigenstaendiges Dashboard. Neues Dashboard anlegen, dann Stift ->
# Drei-Punkte-Menue -> "Raw-Konfigurationseditor" -> alles ersetzen.
#
# Hinweis: Home Assistant liest dieses YAML ein und schreibt es neu.
# Kommentare gehen dabei verloren - das ist normal und schadet nichts.
#
# Ansicht "Fluss" braucht lumina-energy-card aus HACS. Fehlt sie, die
# Ansicht loeschen; die anderen beiden laufen mit Standard-Karten.

views:

  - title: Fluss
    path: fluss
    icon: mdi:transit-connection-variant
    panel: true
    cards:
      - type: custom:lumina-energy-card
        installation_type: "2"
        display_unit: kW
        animation_style: shimmer
        image_style: holographic
        update_interval: 3
        grid_activity_threshold: 50
        sensor_pv_total: sensor.ocean2_solar_power
        sensor_pv_total_secondary: sensor.solarflow_800_pro_solar_input_power
        sensor_bat1_soc: sensor.ocean2_battery
        sensor_bat1_power: sensor.ocean2_battery_power
        sensor_home_load: sensor.ocean2_house_consumption
        sensor_grid_power: sensor.ocean2_grid_power
        sensor_car1_power: sensor.daheimlader_ladeleistung
        show_car_soc: false
        show_car2: false
        show_pv_strings: true
        pv_string1_color: "#ffd54f"
        pv_string2_color: "#ffb300"
        pv_string3_color: "#ff8f00"

  - title: Strings
    path: strings
    icon: mdi:solar-panel-large
    type: sections
    max_columns: 3
    sections:

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Erzeugung gerade
            heading_style: title
            icon: mdi:solar-power
          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: sensor.ocean2_solar_power
                name: Ocean 2
                color: amber
              - type: tile
                entity: sensor.solarflow_800_pro_solar_input_power
                name: Zendure
                color: green
              - type: tile
                entity: sensor.ocean2_house_consumption
                name: Haus
                color: blue
              - type: tile
                entity: sensor.ocean2_grid_power
                name: Netz

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Ocean 2
            icon: mdi:solar-panel-large
          - type: grid
            columns: 3
            square: false
            cards:
              - type: gauge
                entity: sensor.ocean2_string_1_power
                name: String 1
                min: 0
                max: 4500
                needle: true
                severity:
                  green: 1500
                  yellow: 400
                  red: 0
              - type: gauge
                entity: sensor.ocean2_string_2_power
                name: String 2
                min: 0
                max: 4500
                needle: true
                severity:
                  green: 1500
                  yellow: 400
                  red: 0
              - type: gauge
                entity: sensor.ocean2_string_3_power
                name: String 3
                min: 0
                max: 4500
                needle: true
                severity:
                  green: 1500
                  yellow: 400
                  red: 0
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.ocean2_string_1_power
                name: String 1
              - entity: sensor.ocean2_string_2_power
                name: String 2
              - entity: sensor.ocean2_string_3_power
                name: String 3

      - type: grid
        cards:
          - type: heading
            heading: Speicher
            icon: mdi:battery
          - type: gauge
            entity: sensor.ocean2_battery
            name: Ocean 2
            min: 0
            max: 100
            needle: true
            severity:
              green: 50
              yellow: 20
              red: 0
          - type: gauge
            entity: sensor.solarflow_800_pro_electric_level
            name: Zendure
            min: 0
            max: 100
            needle: true
            severity:
              green: 50
              yellow: 20
              red: 0
          - type: entities
            entities:
              - entity: sensor.ocean2_battery_remaining_energy
                name: Ocean 2 verbleibend
              - entity: sensor.solarflow_800_pro_available_kwh
                name: Zendure verbleibend

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Zendure
            icon: mdi:solar-panel
          - type: grid
            columns: 4
            square: false
            cards:
              - type: gauge
                entity: sensor.solarflow_800_pro_solar_power1
                name: PV 1
                min: 0
                max: 500
                needle: true
                severity:
                  green: 250
                  yellow: 80
                  red: 0
              - type: gauge
                entity: sensor.solarflow_800_pro_solar_power2
                name: PV 2
                min: 0
                max: 500
                needle: true
                severity:
                  green: 250
                  yellow: 80
                  red: 0
              - type: gauge
                entity: sensor.solarflow_800_pro_solar_power3
                name: PV 3
                min: 0
                max: 500
                needle: true
                severity:
                  green: 250
                  yellow: 80
                  red: 0
              - type: gauge
                entity: sensor.solarflow_800_pro_solar_power4
                name: PV 4
                min: 0
                max: 500
                needle: true
                severity:
                  green: 250
                  yellow: 80
                  red: 0
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.solarflow_800_pro_solar_power1
                name: PV 1
              - entity: sensor.solarflow_800_pro_solar_power2
                name: PV 2
              - entity: sensor.solarflow_800_pro_solar_power3
                name: PV 3
              - entity: sensor.solarflow_800_pro_solar_power4
                name: PV 4

  - title: Zahlen
    path: zahlen
    icon: mdi:table
    type: sections
    max_columns: 2
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Wer liefert was
            heading_style: title
            icon: mdi:scale-balance
          - type: markdown
            content: |
              {% set o1 = states('sensor.ocean2_string_1_power') | float(0) %}
              {% set o2 = states('sensor.ocean2_string_2_power') | float(0) %}
              {% set o3 = states('sensor.ocean2_string_3_power') | float(0) %}
              {% set z = states('sensor.solarflow_800_pro_solar_input_power') | float(0) %}
              {% set gesamt = o1 + o2 + o3 + z %}
              ## {{ gesamt | round }} W insgesamt

              | Quelle | Leistung | Anteil |
              |---|---:|---:|
              | Ocean 2 · String 1 | {{ o1 | round }} W | {{ (o1 / gesamt * 100) | round if gesamt > 0 else 0 }} % |
              | Ocean 2 · String 2 | {{ o2 | round }} W | {{ (o2 / gesamt * 100) | round if gesamt > 0 else 0 }} % |
              | Ocean 2 · String 3 | {{ o3 | round }} W | {{ (o3 / gesamt * 100) | round if gesamt > 0 else 0 }} % |
              | Zendure gesamt | {{ z | round }} W | {{ (z / gesamt * 100) | round if gesamt > 0 else 0 }} % |

              {% if gesamt > 500 and o3 < 10 and (o1 + o2) > 500 %}
              > String 3 liefert nichts, waehrend die anderen arbeiten.
              > Entweder haengt dort nichts, oder er ist ausgefallen.
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Ertrag
            icon: mdi:counter
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.ocean2_solar_production
                name: Ocean 2
                color: amber
              - type: tile
                entity: sensor.solarflow_800_pro_aggr_solar
                name: Zendure
                color: green
          - type: history-graph
            hours_to_show: 168
            title: Sieben Tage
            entities:
              - entity: sensor.ocean2_solar_power
                name: Ocean 2
              - entity: sensor.solarflow_800_pro_solar_input_power
                name: Zendure

      - type: grid
        cards:
          - type: heading
            heading: Zendure im Detail
            icon: mdi:information-outline
          - type: entities
            entities:
              - entity: sensor.solarflow_800_pro_output_home_power
                name: Abgabe ans Haus
              - entity: sensor.solarflow_800_pro_bat_in_out
                name: Batterieleistung
              - entity: sensor.solarflow_800_pro_aggr_charge
                name: Gesamt geladen
              - entity: sensor.solarflow_800_pro_aggr_discharge
                name: Gesamt entladen
          - type: markdown
            content: |
              {% set c = states('sensor.solarflow_800_pro_aggr_charge') | float(0) %}
              {% set d = states('sensor.solarflow_800_pro_aggr_discharge') | float(0) %}
              {% if c > 0 %}
              **Wirkungsgrad im Umlauf: {{ (d / c * 100) | round(1) }} %**

              Von {{ c | round }} kWh, die in den Speicher gingen, kamen
              {{ d | round }} kWh wieder heraus. Die Differenz von
              {{ (c - d) | round }} kWh ist Verlust.

              Deshalb lohnt es sich, Strom direkt zu verbrauchen, statt ihn
              erst zwischenzuspeichern.
              {% endif %}
